# C1 领证纪念照模板（快道，SeedEdit/Seedream 直出）
# 每个模板：name 显示名 / description 用途 / prompt 提示词 / size 出图尺寸
templates:
  red_bg_upgrade:
    name: 红底升级
    description: 把登记处拍的红底证件合照升级为影楼级精修纪念照
    prompt: >-
      结婚登记证件合照精修升级：保留正红色纯色背景，两人白衬衫正装并肩半身照，
      肤质精修细腻通透，布光均匀立体如影楼柔光箱，表情自然幸福，色彩干净高级，
      证件照构图但达到影楼纪念照质感。
      保持与参考图人物五官、脸型完全一致，不得改变长相。
    size: 2K
  illustration_poster:
    name: 插画海报
    description: 把登记照转成手绘插画风纪念海报
    prompt: >-
      把这张结婚登记合照转绘成温暖的扁平手绘插画海报：柔和的奶油色背景，
      两人穿白衬衫相依微笑，线条干净温柔，配色低饱和治愈系，画面下方留白，
      整体像独立插画师的婚礼海报作品，人物特征高度还原。
      保持与参考图人物五官、脸型完全一致（插画化但仍可辨认是本人）。
    size: 2K
  polaroid:
    name: 拍立得风
    description: 拍立得相纸质感的随拍纪念照
    prompt: >-
      拍立得相纸风格的结婚纪念照：两人穿白衬衫亲密靠在一起自拍视角，
      胶片偏色与柔焦，白边拍立得相纸边框感，暖黄怀旧色调，
      像领证当天随手拍下的真实一刻，自然、松弛、有生活气。
      保持与参考图人物五官、脸型完全一致。画面中不出现任何证件、文书、印章。
    size: 2K
