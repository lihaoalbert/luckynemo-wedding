# 复古胶片：颗粒感暖调，老街巷弄，怀旧氛围
name: 复古胶片
description: 胶片颗粒 + 暖黄怀旧色调，老街纪实感婚纱
prompt: >-
  老城区的巷弄，斑驳的红砖墙与老式木门窗，午后斜射的暖阳拉出长长影子，
  新娘穿复古蕾丝及踝婚纱、戴短头纱与缎面手套，新郎着深棕色复古三件套西装配领结，
  二人推着老式自行车走在巷子里，或倚在砖墙边对望，神情松弛自然。
  胶片质感：细腻颗粒、暖黄色调、轻微暗角、柔和的低对比度，像 90 年代的老照片。
  50mm 镜头，f/2.8，纪实抓拍感构图，柯达 Portra 胶片色彩。
  保持与参考图人物五官、脸型完全一致。
negative_prompt: 五官变形，换脸感，手部畸形，数码锐化感，色彩过饱和，现代招牌入镜
size: 2k
ratio: "3:2"
