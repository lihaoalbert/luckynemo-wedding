# 森系外景：林间逆光，清新自然，呼吸感
name: 森系外景
description: 林间草地 + 午后逆光，轻盈自然的户外婚纱
prompt: >-
  郊外森林草地，午后金色逆光穿过树叶形成柔美的轮廓光与发丝光，
  新娘穿轻盈的齐地轻纱、手持满天星小花束，新郎着浅卡其色休闲西装，
  二人在林间小径牵手漫步回头相视而笑，裙摆被微风轻轻吹起。
  空气感通透，背景大光圈虚化成奶油般光斑，绿色调清新治愈。
  50mm 镜头，f/1.8，全身竖构图，日系清新婚纱写真风格。
  保持与参考图人物五官、脸型完全一致。
negative_prompt: 五官变形，换脸感，手部畸形，树叶长在脸上，色调发灰，路人入镜
size: 2k
ratio: "2:3"
