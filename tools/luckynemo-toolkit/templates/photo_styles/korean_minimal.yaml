# 韩式极简：浅调干净，高级灰，情绪特写
name: 韩式极简
description: 米白浅调 + 极简构图，韩式高级感棚拍
prompt: >-
  韩式极简婚纱棚拍，米白色微水泥质感背景，柔和的自然窗光从侧面洒入，
  新娘穿缎面吊带极简婚纱、低盘发配珍珠耳饰，新郎着浅灰色修身西装无领带，
  二人鼻尖轻触、额头相抵、低头浅笑，情绪细腻克制。
  高调照明，大面积留白，色调是奶白与浅灰的高级灰阶，肤质如奶油。
  85mm 镜头，f/2.0，特写与中近景构图，韩式画报婚纱风格，干净、安静、高级。
  保持与参考图人物五官、脸型完全一致。
negative_prompt: 五官变形，换脸感，手部畸形，色彩浓艳，背景杂物，表情夸张
size: 2k
ratio: "2:3"
