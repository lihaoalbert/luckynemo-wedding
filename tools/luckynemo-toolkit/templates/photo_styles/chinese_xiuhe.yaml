# 中式秀禾：红金囍庆，传统婚俗仪式感
name: 中式秀禾
description: 秀禾服 + 中式婚房布景，红金配色的传统喜庆
prompt: >-
  中式婚房布景，深红色丝绒背景，雕花木窗与红灯笼，金色囍字贴饰，
  新娘穿正红色金丝刺绣秀禾服、头戴凤冠珠钗，新郎着暗红色长袍马褂，
  二人端坐于太师椅上手持团扇半遮面，或站立案前共执红绸。
  暖调烛光感照明，红金配色浓郁喜庆，刺绣细节金光熠熠。
  70mm 镜头，f/4，中近景对称构图，工笔画般的精致质感，国风婚纱摄影。
  保持与参考图人物五官、脸型完全一致。
negative_prompt: 五官变形，换脸感，手部畸形，服饰纹样错乱，日式元素混入，惨白肤色
size: 2k
ratio: "1:1"
